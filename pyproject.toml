[project]
name = "agentic-workflow-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
]

[project.scripts]
agentic-workflow-generator = "agentic_workflow_generator.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-jsonschema>=4.26.0.20260518",
]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_workflow_generator"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["agentic_workflow_generator"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src",
    "tests",
]
mypy_path = "src"
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["agentic_workflow_generator"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
