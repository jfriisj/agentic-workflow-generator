name: Agentic CI

on:
  pull_request:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: agentic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate generator
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        shell: bash
        run: python -m pip install --disable-pip-version-check "uv==0.12.1"

      - name: Show selected toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "== bash =="
          command -v bash
          bash --version | head -1

          echo
          echo "== git =="
          command -v git
          git --version

          echo
          echo "== uv =="
          command -v uv
          uv --version

      - name: Validate Python 3.11
        shell: bash
        env:
          UV_PYTHON: "3.11"
        run: |
          set -euo pipefail
          rm -rf .venv
          uv run python --version
          uv run agentic-workflow-generator validate-environment
          uv run agentic-workflow-generator doctor-strict

      - name: Validate Python 3.13
        shell: bash
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          rm -rf .venv
          uv run python --version
          uv run agentic-workflow-generator validate-environment
          uv run agentic-workflow-generator doctor-strict

      - name: Prepare architecture model toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv run architecture-model prepare

      - name: Verify architecture model
        shell: bash
        run: |
          set -euo pipefail
          uv run architecture-model check

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(git status --short)"

          if [[ -n "$STATUS" ]]; then
            echo "$STATUS"
            echo "::error::Working tree is not clean after CI validation."
            exit 1
          fi

          echo "PASS: Working tree is clean."
